<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">E. Habib — AI Automation and Agent Developer</title>
  <desc id="desc">Professional blue banner highlighting AI agents, RAG, Voice AI, APIs, and SaaS engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061426"/>
      <stop offset="0.55" stop-color="#0A2240"/>
      <stop offset="1" stop-color="#0B2E59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="55%">
      <stop offset="0" stop-color="#1D8FFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1D8FFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <path d="M0 1H1200" stroke="#60A5FA" stroke-opacity="0.45"/>
  <path d="M0 319H1200" stroke="#38BDF8" stroke-opacity="0.18"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <g transform="translate(62 56)">
      <rect width="232" height="30" rx="15" fill="#0C315A" stroke="#38BDF8" stroke-opacity="0.5"/>
      <circle cx="17" cy="15" r="5" fill="#38BDF8" filter="url(#softGlow)"/>
      <text x="32" y="20" fill="#BAE6FD" font-size="12.5" font-weight="600" letter-spacing="1.45">E. HABIB · PORTFOLIO</text>

      <text x="0" y="92" fill="#F8FAFC" font-size="44" font-weight="750" letter-spacing="-1">AI AUTOMATION</text>
      <text x="0" y="138" fill="url(#accent)" font-size="40" font-weight="750" letter-spacing="-0.8">&amp; AGENT DEVELOPER</text>
      <text x="2" y="178" fill="#C7DDF4" font-size="18" font-weight="450">Building useful AI products from model to deployment.</text>

      <g transform="translate(0 210)" font-size="14" font-weight="650" letter-spacing="0.8">
        <rect width="104" height="32" rx="16" fill="#0B335D" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="52" y="21" fill="#E0F2FE" text-anchor="middle">AI AGENTS</text>
        <rect x="116" width="70" height="32" rx="16" fill="#0B335D" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="151" y="21" fill="#E0F2FE" text-anchor="middle">RAG</text>
        <rect x="198" width="96" height="32" rx="16" fill="#0B335D" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="246" y="21" fill="#E0F2FE" text-anchor="middle">VOICE AI</text>
        <rect x="306" width="94" height="32" rx="16" fill="#0B335D" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="353" y="21" fill="#E0F2FE" text-anchor="middle">AI SAAS</text>
      </g>
    </g>

    <g transform="translate(735 36)">
      <path d="M205 124L90 62M205 124L348 62M205 124L90 210M205 124L348 210" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
      <path d="M90 62V210M348 62V210" fill="none" stroke="#7DD3FC" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="5 7"/>

      <g transform="translate(169 88)">
        <circle cx="36" cy="36" r="46" fill="#0C3767" stroke="#60A5FA" stroke-width="2"/>
        <circle cx="36" cy="36" r="31" fill="#0A284B" stroke="#38BDF8" stroke-opacity="0.35"/>
        <path d="M23 38l9 9 18-23" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="36" cy="36" r="52" fill="none" stroke="#38BDF8" stroke-opacity="0.18"/>
      </g>

      <g text-anchor="middle">
        <g transform="translate(16 36)">
          <rect width="148" height="54" rx="14" fill="#0A284B" stroke="#38BDF8" stroke-opacity="0.45"/>
          <text x="74" y="23" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1.2">INTELLIGENCE</text>
          <text x="74" y="42" fill="#E6F4FF" font-size="15" font-weight="650">LLMs + RAG</text>
        </g>
        <g transform="translate(274 36)">
          <rect width="148" height="54" rx="14" fill="#0A284B" stroke="#60A5FA" stroke-opacity="0.45"/>
          <text x="74" y="23" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="1.2">INTERACTION</text>
          <text x="74" y="42" fill="#E6F4FF" font-size="15" font-weight="650">Voice + Agents</text>
        </g>
        <g transform="translate(16 184)">
          <rect width="148" height="54" rx="14" fill="#0A284B" stroke="#38BDF8" stroke-opacity="0.45"/>
          <text x="74" y="23" fill="#7DD3FC" font-size="12" font-weight="700" letter-spacing="1.2">ENGINEERING</text>
          <text x="74" y="42" fill="#E6F4FF" font-size="15" font-weight="650">Python + APIs</text>
        </g>
        <g transform="translate(274 184)">
          <rect width="148" height="54" rx="14" fill="#0A284B" stroke="#60A5FA" stroke-opacity="0.45"/>
          <text x="74" y="23" fill="#93C5FD" font-size="12" font-weight="700" letter-spacing="1.2">DELIVERY</text>
          <text x="74" y="42" fill="#E6F4FF" font-size="15" font-weight="650">Docker + SaaS</text>
        </g>
      </g>

      <text x="205" y="266" fill="#A9D6F5" font-size="13" text-anchor="middle" letter-spacing="1.5">DESIGN · AUTOMATE · DEPLOY</text>
    </g>
  </g>
</svg>
