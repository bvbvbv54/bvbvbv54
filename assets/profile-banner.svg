<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">AI systems architecture</title>
  <desc id="desc">Models, knowledge, tools, services, and deployed products form an AI systems pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121827"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity=".7"><path d="M218 140H308M488 140H578M758 140H848"/><path d="M668 104V72H758M668 176v32h90"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="66" y="72" fill="#67e8f9" font-size="14" letter-spacing="3">AI SYSTEMS</text>
    <text x="66" y="105" fill="#f8fafc" font-size="25" font-weight="700">Models</text><text x="66" y="131" fill="#94a3b8" font-size="15">LLMs · vision · voice</text>
    <text x="394" y="72" fill="#67e8f9" font-size="14" letter-spacing="3">CONTEXT</text>
    <text x="394" y="105" fill="#f8fafc" font-size="25" font-weight="700">Knowledge</text><text x="394" y="131" fill="#94a3b8" font-size="15">retrieval · evidence · data</text>
    <text x="668" y="72" fill="#c4b5fd" font-size="14" letter-spacing="3">ORCHESTRATION</text>
    <text x="668" y="105" fill="#f8fafc" font-size="25" font-weight="700">Agents</text><text x="668" y="131" fill="#94a3b8" font-size="15">tools · workflows · APIs</text>
    <text x="938" y="72" fill="#c4b5fd" font-size="14" letter-spacing="3">DELIVERY</text>
    <text x="938" y="105" fill="#f8fafc" font-size="25" font-weight="700">Products</text><text x="938" y="131" fill="#94a3b8" font-size="15">services · workers · deployment</text>
  </g>
  <rect x="36" y="198" width="1128" height="42" rx="10" fill="#172033"/><text x="600" y="225" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" text-anchor="middle">Designing the path from model capability to a dependable business workflow.</text>
</svg>
